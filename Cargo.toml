[package]
name = "hozd"
version = "0.1.2"
edition = "2024"
publish = true
description = "HTTP Client TUI"
repository = "https://github.com/LeoBorai/hozd"
categories = ["web-programming", "network-programming"]
homepage = "https://github.com/LeoBorai/hozd"
keywords = ["web", "network"]
license = "MIT OR Apache-2.0"
authors = ["Leo Borai <estebanborai@gmail.com>"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hyper-rustls = "0.27.10"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http2"] }
miette = "7"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.10.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-reflection = "0.14"
unicode-width = "0.2.3"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic-prost = "0.14"
wiremock = "0.6.5"
