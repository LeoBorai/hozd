name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # queries are checked against the committed .sqlx/ metadata, no database needed
  SQLX_OFFLINE: "true"

jobs:
  check-tag:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare
        run: |
          cargo_version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$cargo_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match the Cargo.toml version '$cargo_version'"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-14, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-14, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin hozd --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          name="hozd-${GITHUB_REF_NAME}-${TARGET}"
          bin="hozd"
          [[ "$EXT" == "zip" ]] && bin="hozd.exe"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/${bin}" "dist/$name/"
          cp README.md "dist/$name/"
          cd dist
          if [[ "$EXT" == "zip" ]]; then
            7z a -tzip "${name}.zip" "$name" >/dev/null
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.${EXT}" > "${name}.${EXT}.sha256"
          else
            shasum -a 256 "${name}.${EXT}" > "${name}.${EXT}.sha256"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: hozd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hozd-*
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
