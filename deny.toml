[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-root-certs (Mozilla root certificate data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Older copies pulled in by sqlx / wiremock; drop these once they move to the newer versions.
skip = [
    { crate = "base64@0.22.1", reason = "sqlx-core and wiremock still use 0.22; reqwest uses 0.23" },
    { crate = "hashbrown@0.16.1", reason = "sqlx-core and hashlink still use 0.16" },
    { crate = "syn@2.0.119", reason = "sqlx-macros and other proc-macros still use syn 2; others use 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
