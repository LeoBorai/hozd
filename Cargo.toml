[package]
name = "hozd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
